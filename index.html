<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knox Menu - Cafe & Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="category-navbar">
        <div class="navbar-content">
            <!-- Category links will be dynamically loaded -->
        </div>
        <button class="hamburger-menu" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <img src="Knox-logo.svg" alt="Knox Cafe Logo" class="hero-logo fade-in">
            <p class="fade-in">Artisan Coffee & Fresh Cuisine</p>
            <a href="#menu" class="cta-button fade-in">Explore Menu</a>
        </div>
        <div class="scroll-indicator">
            <span>Scroll Down</span>
            <div class="arrow"></div>
        </div>
    </section>

    <!-- Menu Section -->
    <section id="menu" class="menu-section">
        <!-- Menu will be dynamically loaded from menu.json -->
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <img src="Knox-logo.svg" alt="Knox Cafe" class="footer-logo">
            <p>Open Daily: 15:00 - 01:00</p>
            <p>📍 Link Road L.Fonadhoo | ☎️ (960) 7730307</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
